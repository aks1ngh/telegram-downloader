[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "1.3.0"
description = "Download any file from private or public Telegram groups and channels: voice notes, audio, photos, PDFs, videos and documents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Akash Singh" }]
keywords = ["telegram", "telethon", "downloader", "export", "private-channel", "group", "media", "pdf", "photos", "archive", "backup"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = ["telethon>=1.34"]

[project.scripts]
telegram-downloader = "telegram_downloader:main"
tg-media-export = "telegram_downloader:main"
tg-audio-export = "telegram_downloader:main"

[project.urls]
Homepage = "https://github.com/aks1ngh/telegram-downloader"
Issues = "https://github.com/aks1ngh/telegram-downloader/issues"

[tool.setuptools]
py-modules = ["telegram_downloader"]
