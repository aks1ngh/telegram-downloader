name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 rather than -latest: the newest runner images no longer
        # ship Python 3.9, which is still inside our requires-python range.
        os: [ubuntu-22.04, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q telegram_downloader.py tests

      - name: Offline self-test
        run: python telegram_downloader.py --self-test

      - name: Pipeline test (mock client)
        run: python tests/test_pipeline.py
